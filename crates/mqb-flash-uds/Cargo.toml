[package]
name = "mqb-flash-uds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "SA2 VM, UDS session management, and ECU flashing over CAN"

[features]
# Enable SocketCAN support (Linux only; requires the `automotive/socketcan` feature)
socketcan = ["automotive/socketcan"]
# Enable SAE J2534 PassThru support (Windows)
j2534 = ["automotive/j2534"]

[dependencies]
mqb-transport.workspace = true
mqb-bytes.workspace = true
mqb-lzss.workspace = true
mqb-modules.workspace = true
mqb-sa2.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
automotive.workspace = true

[dev-dependencies]
mqb-binfile.workspace = true
mqb-cboot.workspace = true
mqb-checksum.workspace = true
mqb-modules.workspace = true
tracing-subscriber.workspace = true
